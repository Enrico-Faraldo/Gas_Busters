<html lang="en">

<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="../css/stylePlat.css">

    <script src="../js/sessao.js"></script>
</head>

<body onload="validarSessao()">
    <div class="header">
        <div class="container">
            <h3 onclick="window.location.href='../index.html'" class="titulo-gas-busters"><span
                    style="color: rgb(204, 90, 86);">Gas</span> Busters</h3>
            <ul class="navbar">
                <li>
                    <h2 style="margin-left: -28vw;">Olá, <span id="b_usuario" style="color: #f89b8f;"></span>!</h2>
                </li>
                <li class="agora">
                    <a href="#">Plataformas</a>
                </li>
                <li>
                    <a href="alerta.html">Alertas</a>
                </li>
                <li>|</li>
                <li>
                    <a href="https://bustersgass.atlassian.net/servicedesk/customer/portal/1">Suporte</a>
                </li>
                <a class="a borda" onclick="window.location.href='../index.html'" onclick="limparSessao()">Sair</a>
            </ul>
        </div>
    </div>
    <div class="corpo-plat">
        <div class="banner">
            <h1>Gerencie e monitore suas <span>plataformas</span></h1>
        </div>
        <div class="corpo1">

            <div class="quadroDash">
                <div id="div_cards" class="cards"></div>
            </div>
        </div>
    </div>
  <script>


    window.addEventListener('scroll', function () {         // é um ouvidor que fica sempre atento ao evento de rolagem, ou seja,
      // sempre que a página rolar (scroll), a função será ativada. Resumo: escuta o evento de rolagem "scroll"

      const header = document.querySelector('.header');     // na constante "header", ela busca um elemento HTML. O document.querySelector('.header') busca o primeiro 
      // elemento com a classe ".header", depois ele guarda esse elemento na variável "header". Ou seja, ele pega o cabeçalho. Resumo: pega o elemento ".header"

      header.classList.toggle('rolar', window.scrollY > 0); // aqui é onde jaz o efeito: se a página tiver sido rolada (ou seja, se o scrollY for maior que 0), ele adiciona
      // a classe "rolar", do css; se não, ele remove essa classe - a classe "rolar". Resumo: Adiciona ou remove a classe "rolar"
    });


  </script>
</body>

</html>
<script>
    window.onload = function () {
        buscarPlataformas()
    }
    console.log(sessionStorage);

    document.getElementById('b_usuario').innerHTML = `${sessionStorage.NOME_USUARIO}`


    function buscarPlataformas() {

        let cards = ''

        fetch(`/plataformas/${sessionStorage.ID_EMPRESA}`, {
            method: "GET",
            cache: 'no-store'
        })
            .then(function (response) {
                if (response.ok) {
                    response.json().then(function (resposta) {
                        console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);

                        for (let i = 0; i < resposta.length; i++) {

                            cards += `
                            <button onclick="visualizarPlataforma(${resposta[i].idPlataforma}, '${resposta[i].nome}')" class="card">
                                ${resposta[i].nome}
                                </button>
                                `;
                        }

                        div_cards.innerHTML = cards;

                    });
                } else {
                    console.error('Nenhum dado encontrado ou erro na API');
                }
            })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados: ${error.message}`);
            });
    }

    function visualizarPlataforma(idPlataforma, nome) {
        window.location.href = `dashboard.html?idPlataforma=${idPlataforma}&nome="${nome}"`;
    }
</script>
