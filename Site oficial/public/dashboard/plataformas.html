<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gas-Busters | Plataformas</title>

    <link rel="stylesheet" href="../css/style3.css">

    <script src="../js/sessao.js"></script>
</head>

<body onload="validarSessao()">
    <div class="header">
        <div class="container">
            <img src="../public/assets/img/logo_com_nome.png" width="200px">
            <h3>Olá, <span id="b_usuario">usuário</span>!</h3>
            <ul class="navbar">
                <li class="agora">
                    <a href="#">Plataformas</a>
                </li>
                <li>
                    <a href="alerta.html">Alertas</a>
                </li>
                <li>|</li>
                <li>
                    <a href="">Suporte</a>
                </li>
                <a onclick="limparSessao()">Sair</a>
            </ul>
        </div>
    </div>

    <div class="corpo-plat">
        <div class="banner">
            <h1>Gerencie e monitore suas <span>plataformas</span></h1>
        </div>


        <div class="seletores">
            <div class="filtro">
                <select name="" id="filtrar">
                    <option value="#">Filtrar por</option>
                </select>
            </div>
            <div id="div_cards" class="cards"></div>
        </div>

    </div>


</body>

</html>
<script>
    window.onload = function () {
        buscarPlataformas()
    }
    console.log(sessionStorage);


    function buscarPlataformas() {

        let cards = ''

        fetch(`/plataformas/${sessionStorage.ID_EMPRESA}`, {
            method: "GET",
            cache: 'no-store'
        })
            .then(function (response) {
                if (response.ok) {
                    response.json().then(function (resposta) {
                        console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);

                        for (let i = 0; i < resposta.length; i++) {

                            cards += `
                            <div class="card">
                                ${resposta[i].nome}
                                </div>
                                `;
                        }

                        div_cards.innerHTML = cards;
                        
                    });
                } else {
                    console.error('Nenhum dado encontrado ou erro na API');
                }
            })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados: ${error.message}`);
            });
    }
</script>
