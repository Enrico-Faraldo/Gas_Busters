<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gas-Busters | Dashboard</title>

    <link rel="stylesheet" href="../css/style3.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../js/sessao.js"></script>
</head>

<body>
    <div class="header">
        <div class="container">
            <img src="../public/assets/img/logo_com_nome.png" width="200px">
            <h3>Olá, <span id="b_usuario">usuário</span>!</h3>
            <ul class="navbar">
                <li>
                    <a href="plataformas.html">Plataformas</a>
                </li>
                <li>
                    <a href="alerta.html">Alertas</a>
                </li>
                <li>|</li>
                <li>
                    <a href="">Suporte</a>
                </li>
                <a onclick="limparSessao()">Sair</a>
            </ul>
        </div>
    </div>

    <div class="corpo-dash">
        <div class="titulo">
            <h1 id="h1_plataforma" class="plataforma"></h1>
        </div>

        <div class="centro">
            <div class="selecao">
                <h3>Filtrar </h3>
            </div>

            <div class="grafico">
                <canvas id="myChart"></canvas>
            </div>

            <div class="indicadores">
                <div class="caixa">
                    KPI
                </div>
                <div class="caixa">
                    KPI
                </div>
            </div>
        </div>

    </div>


</body>

<script>
    const ctx = document.getElementById('myChart');

    const urlParams = new URLSearchParams(window.location.search);
    const idPlataforma = urlParams.get('idPlataforma');

    document.getElementById('h1_plataforma').innerHTML = `Plataforma ${idPlataforma}`

    new Chart(ctx, {
        type: 'line',
        data: {
            labels: ['12:00', '13:00', '14:00', '15:00', '16:00', '17:00'],
            datasets: [
                {
                    label: 'Porcentagem de gás',
                    data: [0.8, 1.2, 0.9, 1.5, 0.7, 1.0],
                    backgroundColor: 'rgba(255, 0, 255, 0.5)',
                    borderColor: 'rgba(255, 0, 255, 1)',
                    borderWidth: 1
                },
                {
                    type: 'line',
                    label: 'Limite',
                    data: [5, 5, 5, 5, 5, 5],
                    backgroundColor: '#E5270E',
                    borderColor: '#E5270E',
                    borderWidth: 1
                }],
        },
        options: {
            scales: {
                y: {
                    beginAtZero: true
                }
            },
            plugins: {
                title: {
                    display: true,
                    text: 'Detecção de gás em tempo real na SALA DE COMPRESSORES'
                }
            }

        }
    });
</script>

</html>
