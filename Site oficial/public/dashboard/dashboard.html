    let graficoExiste = false;

    function verificarAlertasCriticos() {



        fetch(`/medidas/medidasCriticas/${sessionStorage.ID_EMPRESA}`, { cache: 'no-store' })
            .then(response => {
                if (response.ok) {
                    return response.text();
                } else {
                    throw new Error('Erro na resposta da API');
                    proximaAtualizacao = setTimeout(() => verificarAlertasCriticos(), 2000);
                }
            })
            .then(texto => {
                if (texto == '') {

                    div_alerta_principal.innerHTML = `<h2 class="certo" style="color:green">Tudo certo!</h2>
            <h4>Você não tem alertas</h4>`;

                } else {
                    const novoRegistro = JSON.parse(texto);
                    console.log(`Dados recebidos: ${JSON.stringify(novoRegistro)}`);


                    let frase = '';
                    for (let i = 0; i < novoRegistro.length; i++) {

                        frase += `<p>${i + 1}. ${novoRegistro[i].nome_plataforma} - ${novoRegistro[i].posicionamento} (${novoRegistro[i].percentual_de_gas}%)</p>`;
                    }

                    div_alerta_principal.innerHTML = `<h2 class="alerta" style="color:red">ALERTA!</h2>` + frase;
                }

                proximaAtualizacao = setTimeout(() => verificarAlertasCriticos(), 2000);
            })
            .catch(error => {
                console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
            });

    }

    function verificarAlertaMaximo() {



        fetch(`/medidas/medidaMaxima/${sessionStorage.ID_EMPRESA}`, { cache: 'no-store' })
            .then(response => {
                if (response.ok) {

                } else {
                    throw new Error('Erro na resposta da API');
                }
            })
            .then(texto => {
                if (texto == '') {

                    div_alerta_maximo.innerHTML = `<h2 class="certo" style="color:green">Tudo Certo!</h2>
            <h4>Não há sensores com valores críticos</h4>`;
                } else {
                    const novoRegistro = JSON.parse(texto);
                    console.log(`Dados recebidos: ${JSON.stringify(novoRegistro)}`);

                    div_alerta_maximo.innerHTML = `<p>Sensor com maior porcentagem:</h4>${novoRegistro[0].nome_plataforma} - ${novoRegistro[0].posicionamento} (${novoRegistro[0].percentual_de_gas}%)</p>`;
                }

                proximaAtualizacao = setTimeout(() => verificarAlertaMaximo(), 2000);
            })
            .catch(error => {
                console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
                proximaAtualizacao = setTimeout(() => verificarAlertaMaximo(), 2000);
            });


    }

    function obterLocalidades(idPlataforma) {

        //alterarTitulo(idPlataforma)

        /*if (proximaAtualizacao != undefined) {
            clearTimeout(proximaAtualizacao);
        }*/

        fetch(`/medidas/locaisPorPlataforma/${idPlataforma}`, { cache: 'no-store' }).then(function (response) {
            if (response.ok) {
                response.json().then(function (resposta) {
                    console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);

                    let opcoes = ''
                    for (let i = 0; i < resposta.length; i++) {
                        opcoes += `<option value="${resposta[i].idSensor}">${resposta[i].idSensor}: ${resposta[i].posicionamento}</option>`
                    }

                    opt_area.innerHTML = opcoes


                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
            }
        })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
            });
    }

    function obterDadosGraficoSensor() {

        let idSensor = opt_area.value

        //alterarTitulo(idSensor)

        /*if (proximaAtualizacao != undefined) {
            clearTimeout(proximaAtualizacao);
        }*/

        fetch(`/medidas/ultimas/${idSensor}`, { cache: 'no-store' }).then(function (response) {
            if (response.ok) {
                response.json().then(function (resposta) {
                    console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);
                    resposta.reverse();

                    plotarGraficoSensor(resposta, idSensor);

                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
            }
        })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
            });
    }

    // Configura o gráfico (cores, tipo, etc), materializa-o na página e, 
    // A função *plotarGraficoSensor* também invoca a função *atualizarGrafico*
    function plotarGraficoSensor(resposta, idSensor) {

        /*if (graficoExiste){
            myChart.destroy();
        }*/




        console.log('iniciando plotagem do gráfico...');

        // Criando estrutura para plotar gráfico - labels
        let labels = [];

        // Criando estrutura para plotar gráfico - dados
        let dados = {
            labels: labels,
            datasets: [{
                label: 'Concentração de Gás do sensor em porcentagem',
                data: [],
                fill: false,
                borderColor: 'rgb(75, 192, 192)',
                tension: 0.1
            },
            {
                label: 'Limite seguro (5%)',
                data: [],
                fill: false,
                borderColor: 'red',
                borderDash: [5, 5],
                pointRadius: 0
            }]
        };

        console.log('----------------------------------------------')
        console.log('Estes dados foram recebidos pela funcao "obterDadosGrafico" e passados para "plotarGrafico":')
        console.log(resposta)

        // Inserindo valores recebidos em estrutura para plotar o gráfico
        for (i = 0; i < resposta.length; i++) {
            var registro = resposta[i];
            labels.push(registro.momento_grafico);
            dados.datasets[0].data.push(registro.percentual_de_gas);
            dados.datasets[1].data.push(5);
        }

        console.log('----------------------------------------------')
        console.log('O gráfico será plotado com os respectivos valores:')
        console.log('Labels:')
        console.log(labels)
        console.log('Dados:')
        console.log(dados.datasets)
        console.log('----------------------------------------------')

        //for (let j = 0; )

        // Criando estrutura para plotar gráfico - config
        const config = {
            type: 'line',
            data: dados,
        };

        // Adicionando gráfico criado em div na tela
        if (myChart) {
            myChart.destroy()
        }

        myChart = new Chart(
            document.getElementById(`myChart`),
            config
        );
        //graficoExiste = true;

        setTimeout(() => atualizarGraficoSensor(idSensor, dados, myChart), 2000);
    }


    // Esta função *atualizarGraficoSensor* atualiza o gráfico que foi renderizado na página,
    // buscando a última medida inserida em tabela contendo as capturas, 

    //     Se quiser alterar a busca, ajuste as regras de negócio em src/controllers
    //     Para ajustar o "select", ajuste o comando sql em src/models
    function atualizarGraficoSensor(idSensor, dados, myChart) {



        fetch(`/medidas/tempo-real/${idSensor}`, { cache: 'no-store' }).then(function (response) {
            if (response.ok) {
                response.json().then(function (novoRegistro) {

                    //obterdados(idSensor);
                    // alertar(novoRegistro, idSensor);
                    console.log(`Dados recebidos: ${JSON.stringify(novoRegistro)}`);
                    console.log(`Dados atuais do gráfico:`);
                    console.log(dados);

                    /*let avisoCaptura = document.getElementById(`avisoCaptura${idSensor}`)
                    avisoCaptura.innerHTML = ""*/


                    if (novoRegistro[0].momento_grafico == dados.labels[dados.labels.length - 1]) {
                        console.log("---------------------------------------------------------------")
                        console.log("Como não há dados novos para captura, o gráfico não atualizará.")
                        //avisoCaptura.innerHTML = "<i class='fa-solid fa-triangle-exclamation'></i> Foi trazido o dado mais atual capturado pelo sensor. <br> Como não há dados novos a exibir, o gráfico não atualizará."
                        console.log("Horário do novo dado capturado:")
                        console.log(novoRegistro[0].momento_grafico)
                        console.log("Horário do último dado capturado:")
                        console.log(dados.labels[dados.labels.length - 1])
                        console.log("---------------------------------------------------------------")
                    } else {
                        // tirando e colocando valores no gráfico
                        dados.labels.shift(); // apagar o primeiro
                        dados.labels.push(novoRegistro[0].momento_grafico); // incluir um novo momento

                        dados.datasets[0].data.shift();  // apagar o primeiro de umidade
                        dados.datasets[0].data.push(novoRegistro[0].percentual_de_gas); // incluir uma nova medida de umidade

                        myChart.update();
                    }

                    // Altere aqui o valor em ms se quiser que o gráfico atualize mais rápido ou mais devagar
                    proximaAtualizacao = setTimeout(() => atualizarGraficoSensor(idSensor, dados, myChart), 2000);
                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
                // Altere aqui o valor em ms se quiser que o gráfico atualize mais rápido ou mais devagar
                proximaAtualizacao = setTimeout(() => atualizarGraficoSensor(idSensor, dados, myChart), 2000);
            }
        })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
            });

    }
