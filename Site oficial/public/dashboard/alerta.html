<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gas-Busters | Alertas</title>

    <link rel="stylesheet" href="../css/style3.css">
    <script src="../js/sessao.js"></script>
</head>

<body onload="validarSessao()">
    <!-- Navbar do site -->
    <div class="header">
        <div class="container">

            <h3 onclick="window.location.href='./index.html'" class="titulo-gas-busters"><span
                    style="color: rgb(204, 90, 86);">Gas</span> Busters</h3>

            <ul class="navbar">
                <li class="agora">
                    <a class="a borda" href="#">Alertas</a>
                </li>
                <li>
                    <a class="a borda" href="plataformas.html">Plataformas</a>
                </li>
                <li>
                    <a class="a borda">Suporte</a>
                </li>
                <li class="a">|</li>
                <li>
                    <a class="a borda">Sair</a>
                </li>
            </ul>
        </div>
    </div>
    <!-- fim desse compartimento -->


    <div class="corpo">


        <div class="dados">
            <div id="div_alerta_maximo" class="kpi">1</div>
            <div id="div_alerta_semi_critico" class="kpi">2</div>
            <div id="div_alertas_mensais" class="kpi">3</div>
        </div>

        <div class="container">

            <div id="div_alerta_principal" class="aviso">
                <!--<h2>Tudo Certo!</h2>
                <h4>Você não tem alertas</h4>-->
            </div>

        </div>

    </div>
</body>
<script>
    window.onload = function () {
        verificarAlertasCriticos()
        verificarAlertaMaximo()
        verificarAlertasSemiCriticos()
        verificarNumeroDeAlertasMensais()
    }
    document.getElementById('b_usuario').innerHTML = `${sessionStorage.NOME_USUARIO}`

    function verificarAlertasCriticos() {



        fetch(`/medidas/medidasCriticas/${sessionStorage.ID_EMPRESA}`, { cache: 'no-store' }).then(function (response) {
            if (response.ok) {
                response.json().then(function (novoRegistro) {

                    //obterdados();
                    // alertar(novoRegistro, );
                    console.log(`Dados recebidos: ${JSON.stringify(novoRegistro)}`);
                    console.log(`Dados atuais do gráfico:`);

                    let haRisco = false
                    let leiturasArriscadas = []

                    for (let i = 0; i < novoRegistro.length; i++) {

                        if (Number(novoRegistro[i].percentual_de_gas) >= 5) {
                            haRisco = true

                            leiturasArriscadas.push(novoRegistro[i])
                        }
                    }

                    if (!haRisco) {
                        div_alerta_principal.innerHTML = `<h2>Tudo Certo!</h2>
                <h4>Você não tem alertas</h4>`
                    }

                    else {
                        let frase = ''
                        for (let j = 0; j < leiturasArriscadas.length; j++) {
                            frase += `<div id="div_alerta_principal" class="mensagem">
                                <h4>${leiturasArriscadas[j].nome_plataforma} - ${leiturasArriscadas[j].posicionamento} (${leiturasArriscadas[j].percentual_de_gas}%)</h4>
                                </div>`
                        }

                        div_alerta_principal.innerHTML = `<h2>ALERTA!</h2>` + frase
                    }


                    // Altere aqui o valor em ms se quiser que o gráfico atualize mais rápido ou mais devagar
                    proximaAtualizacao = setTimeout(() => verificarAlertasCriticos(), 2000);
                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
                // Altere aqui o valor em ms se quiser que o gráfico atualize mais rápido ou mais devagar
                proximaAtualizacao = setTimeout(() => verificarAlertasCriticos(), 2000);
            }
        })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
            });

    }

    function verificarAlertaMaximo() {



        fetch(`/medidas/medidaMaxima/${sessionStorage.ID_EMPRESA}`, { cache: 'no-store' }).then(function (response) {
            if (response.ok) {
                response.json().then(function (novoRegistro) {

                    //obterdados();
                    // alertar(novoRegistro, );
                    console.log(`Dados recebidos: ${JSON.stringify(novoRegistro)}`);
                    console.log(`Dados atuais do gráfico:`);

                    div_alerta_maximo.innerHTML = `Sensor com maior porcentagem:<h4>${novoRegistro[0].nome_plataforma} - ${novoRegistro[0].posicionamento} (${novoRegistro[0].percentual_de_gas}%)</h4>`


                    // Altere aqui o valor em ms se quiser que o gráfico atualize mais rápido ou mais devagar
                    proximaAtualizacao = setTimeout(() => verificarAlertaMaximo(), 2000);
                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
                // Altere aqui o valor em ms se quiser que o gráfico atualize mais rápido ou mais devagar
                proximaAtualizacao = setTimeout(() => verificarAlertaMaximo(), 2000);
            }
        })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
            });

    }

    function verificarAlertasSemiCriticos() {



        fetch(`/medidas/medidasCriticas/${sessionStorage.ID_EMPRESA}`, { cache: 'no-store' }).then(function (response) {
            if (response.ok) {
                response.json().then(function (novoRegistro) {

                    //obterdados();
                    // alertar(novoRegistro, );
                    console.log(`Dados recebidos: ${JSON.stringify(novoRegistro)}`);
                    console.log(`Dados atuais do gráfico:`);

                    let haRisco = false
                    let leiturasArriscadas = []

                    for (let i = 0; i < novoRegistro.length; i++) {

                        if (Number(novoRegistro[i].percentual_de_gas) < 5 && Number(novoRegistro[i].percentual_de_gas) >= 4) {
                            haRisco = true

                            leiturasArriscadas.push(novoRegistro[i])
                        }
                    }

                    if (!haRisco) {
                        div_alerta_semi_critico.innerHTML = `<h2>Tudo Certo!</h2>
                <h4>Você não tem alertas</h4>`
                    }

                    else {
                        let frase = ''
                        for (let j = 0; j < leiturasArriscadas.length; j++) {
                            frase += `
                                <h4>${leiturasArriscadas[j].nome_plataforma} - ${leiturasArriscadas[j].posicionamento} (${leiturasArriscadas[j].percentual_de_gas}%)</h4>
                                `
                        }

                        div_alerta_semi_critico.innerHTML = `<h2>ALERTA!</h2>` + frase
                    }


                    // Altere aqui o valor em ms se quiser que o gráfico atualize mais rápido ou mais devagar
                    proximaAtualizacao = setTimeout(() => verificarAlertasSemiCriticos(), 2000);
                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
                // Altere aqui o valor em ms se quiser que o gráfico atualize mais rápido ou mais devagar
                proximaAtualizacao = setTimeout(() => verificarAlertasSemiCriticos(), 2000);
            }
        })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
            });

    }

    function verificarNumeroDeAlertasMensais() {



        fetch(`/medidas/alertasMensais/${sessionStorage.ID_EMPRESA}`, { cache: 'no-store' }).then(function (response) {
            if (response.ok) {
                response.json().then(function (novoRegistro) {

                    //obterdados();
                    // alertar(novoRegistro, );
                    console.log(`Dados recebidos: ${JSON.stringify(novoRegistro)}`);
                    console.log(`Dados atuais do gráfico:`);

                    div_alertas_mensais.innerHTML = `Quantidades de alertas do mês passado até hoje: ${novoRegistro[0].numero_de_alertas}`


                    // Altere aqui o valor em ms se quiser que o gráfico atualize mais rápido ou mais devagar
                    proximaAtualizacao = setTimeout(() => verificarNumeroDeAlertasMensais(), 2000);
                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
                // Altere aqui o valor em ms se quiser que o gráfico atualize mais rápido ou mais devagar
                proximaAtualizacao = setTimeout(() => verificarNumeroDeAlertasMensais(), 2000);
            }
        })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
            });

    }
</script>

</html>
