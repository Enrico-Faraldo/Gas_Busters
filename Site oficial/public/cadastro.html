                        <br>
                    </div>
                    <div class="campo">
                        <span>Nome:</span>
                        <input id="ipt_nome" type="text" placeholder="Seu nome" />
                        <br>
                    </div>
                    <div class="campo">
                        <span>CPF:</span>
                        <input id="ipt_cpf" type="text" placeholder="23456789012" />
                        <br>
                    </div>
                    <div class="campo">
                        <span>E-mail:</span>
                        <input id="ipt_email" type="text" placeholder="meuemail@provedor.com" />
                        <br>
                    </div>
                    <div class="campo">
                        <span>Senha:</span>
                        <input id="ipt_senha" type="password" placeholder="******" />
                        <br>
                    </div>
                    <div class="campo">
                        <span>Confirmação da Senha:</span>
                        <input id="ipt_confirma_senha" type="password" placeholder="******" />
                        <br>
                    </div>
                    <button id="botao" onclick="cadastrar()">Cadastrar</button>
                </div>
            </div>

    </div>
</div>

<script>
    function cadastrar() {
        var codigo = Number(ipt_codigo.value);
        var nome = ipt_nome.value;
        var cpf = ipt_cpf.value
        var email = ipt_email.value;
        var senha = ipt_senha.value;
        var confirmarSenha = ipt_confirma_senha.value;
        var tentativas = 3

        if (cpf.length != 11) {
            alert("O CPF deve ter exatamente 11 dígitos.");
        }

        if (!email.includes("@")) {
            alert(`Email não possui @`)
        }
        if (senha != confirmarSenha) {
            alert("Senhas diferentes, confirme novamente.")
        }

        while (codigo != "123" && tentativas > 1) {
            tentativas--
            alert(`Esse codigo não existe! Você tem mais ${tentativas} tentativa(s).`);
            codigo = prompt("Confirme seu código novamente:");
            ipt_codigo.value = codigo
        }

        if (codigo == "123" && email.includes("@") && senha == confirmarSenha && cpf.length == 11) {
            window.location.href = "login.html";
        }
    }
</script>
