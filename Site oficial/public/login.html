<script>
    let listaUsuarios = ['John', 'Maria', 'Carlos', 'Fulano', 'Michele'];

    function fazerLogin() {
        let usuario = usuario_input.value;
        let senha = senha_input.value;

        if (usuario === "" || senha === "") {
            alert("Preencha todos os campos!");
            return;
        }

        let loginValido = false;

        for (let i = 0; i < listaUsuarios.length; i++) {
            if (listaUsuarios[i] === usuario && senha === "1234") {
                loginValido = true;
                break;
            }
        }

        if (loginValido) {
            window.location.href = "dashboard.html";
        } else {
            alert("Usuário ou senha inválidos!");
        }
    }
</script>
