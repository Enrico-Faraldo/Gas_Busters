<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/logo.png">
    <link rel="stylesheet" href="css/style2.css">
    <title>Calculadora financeira</title>
</head>

<body>

    <div class="header">
        <div class="container">
            <img src="img/logo_com_nome.png" width="200px">
            <ul class="navbar">
                <li><a href="index.html">Menu</a></li>
                <li class="agora"><a href="#">Simulador</a></li>
                <li>|</li>
                <li><a href="login.html">Login</a></li>
                <li><a href="cadastro.html">Cadastro</a></li>
            </ul>
        </div>
    </div>

    <div class="login">
        <div class="container" style="display: flex; gap: 30px;">

            <div class="card-simulador borda" style="width: 60%;">
                <h2>Simulador Financeiro</h2>
                <div class="formulario">
                    <div class="campo">
                        <h3>Quantas plataformas sua empresa possui?</h3>
                        <input type="number" id="ipt_plataformas">
                    </div>
                    <div class="campo">
                        <h3>Qual o valor médio de uma plataforma (em R$)?</h3>
                        <input type="number" id="ipt_valor">
                    </div>
                    <div class="campo">
                        <h3>Por quantos meses o sistema será utilizado?</h3>
                        <input type="number" id="ipt_meses">
                    </div>
                    <button onclick="calcular()" id="botao">Calcular</button>
                    <div id="erro" class="erro"></div>
                    <div id="resultado" style="text-align: center; padding: 10px; background-color: #f0f0f0; border-radius: 10px;"></div>
                </div>
            </div>

        </div>
    </div>

    <div class="footer">
        <div class="container">
            <h4>Informações de contato: <br>
                Telefone: (11) 94465-5562<br>
                E-mail: bustersgas@gmail.com</h4>
        </div>
    </div>

    <script>
        
        var gasVazadoPorMes = 100000; // considerando 100 mil m³ de gás
        var tarifaGas = 1.308925; // conforme faixa 50.000 a 300.000

        function calcular() {
            var plataformas = Number(ipt_plataformas.value);
            var valorPlataforma = Number(ipt_valor.value);
            var meses = Number(ipt_meses.value);

            if (plataformas > 0 && valorPlataforma > 0 && meses >= 0) {

                // economia por explosões evitadas
                var economiaExplosoes = plataformas * valorPlataforma * 0.5;

                // prejuízo mensal por vazamento de gás, considerando 100.000 m³ de gás e tarifa de R$ 1,308925/m³
                var prejuizoGasMensal = 100000 * 1.308925;

                var economiaGasMensal = prejuizoGasMensal * 0.5 * plataformas;
                var economiaGasTotal = economiaGasMensal * meses;

                var economiaTotal = economiaExplosoes + economiaGasTotal;

                // projeção de economia com explosões evitadas
                var economiaExplosoes6Meses = economiaExplosoes;
                var economiaExplosoes1Ano = economiaExplosoes * 2;
                var economiaExplosoes10Anos = economiaExplosoes * 10;

                // Projeção de economia com vazamento de gás evitados
                var economiaGas6Meses = economiaGasMensal * 6;
                var economiaGas1Ano = economiaGasMensal * 12;
                var economiaGas10Anos = economiaGasMensal * 120;

                resultado.innerHTML = `
            <p style="font-size: 25px">Com ${plataformas} plataformas no valor médio de ${valorPlataforma.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })} cada, sua empresa <strong>evita</strong> em média <span class="valorGasto" style="color: green"><u>${economiaTotal.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}</u></span> em prejuízos ao longo de ${meses} meses.</p>
            <h2>Economia Potencial</h2>
            <ul style="font-size: 25px">
                <li>Em 1 mês (explosões evitadas): <strong>${economiaExplosoes.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}</strong></li>
                <li>Em 6 meses (explosões evitadas): <strong>${economiaExplosoes6Meses.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}</strong></li>
                <li>Em 1 ano (explosões evitadas): <strong>${economiaExplosoes1Ano.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}</strong></li>
                <li>Em 10 anos (explosões evitadas): <strong>${economiaExplosoes10Anos.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}</strong></li>
                <br>
                <li>Em 1 mês (gás não vazado): <strong>${economiaGasMensal.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}</strong></li>
                <li>Em 6 meses (gás não vazado): <strong>${economiaGas6Meses.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}</strong></li>
                <li>Em 1 ano (gás não vazado): <strong>${economiaGas1Ano.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}</strong></li>
                <li>Em 10 anos (gás não vazado): <strong>${economiaGas10Anos.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}</strong></li>
            </ul>
        </div>
    `;
                erro.innerHTML = "";
            } else {
                alert('Preencha todos os campos com valores válidos!');
                erro.innerHTML = "Verifique se todos os campos estão preenchidos corretamente.";
                resultado.innerHTML = "";
            }
        }
    </script>

</body>

</html>
